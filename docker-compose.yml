services:
  orizonte-site:
    build: .
    container_name: orizonte-site
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.orizonte.rule=Host(`orizontechales.com.br`) || Host(`www.orizontechales.com.br`)"
      - "traefik.http.routers.orizonte.entrypoints=websecure"
      - "traefik.http.routers.orizonte.tls=true"
      - "traefik.http.routers.orizonte.tls.certresolver=letsencrypt"
      - "traefik.http.services.orizonte.loadbalancer.server.port=80"
      # Redireciona www pra apex
      - "traefik.http.middlewares.orizonte-www-to-apex.redirectregex.regex=^https?://www\\.orizontechales\\.com\\.br/(.*)"
      - "traefik.http.middlewares.orizonte-www-to-apex.redirectregex.replacement=https://orizontechales.com.br/$${1}"
      - "traefik.http.middlewares.orizonte-www-to-apex.redirectregex.permanent=true"
      - "traefik.http.routers.orizonte.middlewares=orizonte-www-to-apex"

networks:
  web:
    external: true
